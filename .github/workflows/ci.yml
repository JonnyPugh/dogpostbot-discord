name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a master run that may be
  # publishing an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    name: e2e (real Discord)
    runs-on: ubuntu-latest
    # Secrets are the trust boundary here. GitHub never passes repository
    # secrets to PRs from forks, so strangers' PRs cannot read DISCORD_TOKEN.
    # Same-repo PRs (branches pushed by people with write access) DO get the
    # secrets, so keep e2e limited to pushes, manual runs, and same-repo PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run e2e tests against Discord
        run: npm run test:e2e
        env:
          E2E_STRICT: '1'
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}

  docker:
    name: Build image
    needs: unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dogpostbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # Without DISCORD_TOKEN the bot must exit non-zero with a clear error.
        run: |
          if docker run --rm dogpostbot:ci; then
            echo "::error::expected the bot to exit non-zero without DISCORD_TOKEN"
            exit 1
          fi

  publish:
    name: Publish image
    # gated on the real-Discord e2e run: no publish unless it passes
    needs: [unit, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: jonnypugh/dogpostbot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
